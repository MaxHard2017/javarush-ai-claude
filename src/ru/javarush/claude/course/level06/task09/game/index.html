<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Змейка</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #12151c;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e8ecf3;
    }
    h1 { font-size: 22px; font-weight: 700; }
    #score { font-size: 16px; color: #9aa4b2; }
    canvas {
      background: #1b1f28;
      border: 2px solid #2a2f3a;
      border-radius: 8px;
    }
    #over {
      position: fixed; inset: 0;
      display: none;
      align-items: center; justify-content: center;
      flex-direction: column; gap: 12px;
      background: rgba(10, 12, 16, 0.82);
    }
    #over.show { display: flex; }
    #over p { font-size: 20px; }
    #over button {
      background: #4a8cff; color: #fff; border: 0;
      padding: 10px 22px; font-size: 15px; border-radius: 8px; cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Змейка 🐍</h1>
  <div id="score">Очки: 0</div>
  <canvas id="board" width="360" height="360"></canvas>

  <div id="over">
    <p id="over-text">Игра окончена</p>
    <button id="restart">Играть снова</button>
  </div>

  <script>
    // ── Змейка. Поле-сетка, движение по тику, еда, рост, счёт.
    // Столкновение со стеной или своим хвостом = конец игры.
    const CELL = 18;                 // размер клетки в пикселях
    const COLS = 20, ROWS = 20;      // поле 20×20 клеток
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const overEl = document.getElementById('over');

    let snake, dir, nextDir, food, score, alive, timer, grew;

    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    const audioContext = new AudioContextClass();
    const masterGain = audioContext.createGain();
    masterGain.gain.value = 0.08;
    masterGain.connect(audioContext.destination);
    let backgroundOscillator = null;

    function startBackgroundTone() {
      if (backgroundOscillator) return;
      backgroundOscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      backgroundOscillator.type = 'sine';
      backgroundOscillator.frequency.value = 110;
      gain.gain.value = 0.12;
      backgroundOscillator.connect(gain);
      gain.connect(masterGain);
      backgroundOscillator.start();
    }

    function stopBackgroundTone() {
      if (!backgroundOscillator) return;
      backgroundOscillator.stop();
      backgroundOscillator = null;
    }

    function resumeAudio() {
      if (audioContext.state === 'suspended') audioContext.resume();
    }

    function playEatSound() {
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      oscillator.type = 'square';
      oscillator.frequency.value = 880;
      gain.gain.setValueAtTime(0.35, audioContext.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.12);
      oscillator.connect(gain);
      gain.connect(masterGain);
      oscillator.start(audioContext.currentTime);
      oscillator.stop(audioContext.currentTime + 0.12);
    }

    // Стартовое состояние игры: змейка из 3 клеток по центру, направление вправо.
    function initGame() {
      snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      alive = true;
      startBackgroundTone();
      scoreEl.textContent = 'Очки: 0';
      overEl.classList.remove('show');
      eatFood();                     // поставить первую еду
    }

    // Поставить еду на случайную свободную клетку (не на теле змейки).
    function eatFood() {
      let cell;
      do {
        cell = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      } while (snake.some(s => s.x === cell.x && s.y === cell.y));
      food = cell;
    }

    // Сдвинуть змейку на одну клетку в текущем направлении.
    // Если голова попала на еду — растём и ставим новую еду.
    // Хвост убираем позже, в конце тика, — одним местом на все случаи.
    function moveSnake() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      snake.unshift(head);
      grew = false;
      if (head.x === food.x && head.y === food.y) {
        playEatSound();
        score += 1;
        scoreEl.textContent = 'Очки: ' + score;
        eatFood();
        grew = true;
      }
    }

    // Проверить, не врезалась ли голова в стену или в своё тело.
    // ФИКС бага «ложная смерть на развороте»: хвост в этот тик уезжает (если не
    // выросли) — его клетка фактически свободна, поэтому уходящий хвостовой сегмент
    // в проверке НЕ участвует. Раньше он проверялся — и голова, заходящая на клетку
    // уезжающего хвоста, ложно засчитывалась как столкновение.
    function checkCollision() {
      const head = snake[0];
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        return true;                 // врезались в стену
      }
      const bodyEnd = grew ? snake.length : snake.length - 1;  // без уходящего хвоста
      for (let i = 1; i < bodyEnd; i++) {   // тело начиная со второго сегмента
        if (snake[i].x === head.x && snake[i].y === head.y) {
          return true;               // врезались в своё тело
        }
      }
      return false;
    }

    // Нарисовать поле, еду и змейку.
    function draw() {
      ctx.fillStyle = '#1b1f28';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      // еда
      ctx.fillStyle = '#ff5b6e';
      ctx.fillRect(food.x * CELL + 2, food.y * CELL + 2, CELL - 4, CELL - 4);
      // змейка
      ctx.fillStyle = '#4ad66d';
      for (const s of snake) {
        ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
      }
    }

    // Один тик игры: подвинулись, проверили столкновение, убрали хвост, перерисовали.
    function tick() {
      if (!alive) return;
      moveSnake();
      if (checkCollision()) {
        alive = false;
        clearInterval(timer);
        stopBackgroundTone();
        overEl.classList.add('show');
        return;
      }
      if (!grew) snake.pop();        // хвост уезжает в конце тика
      draw();
    }

    // Повороты стрелками. Разворот на 180° запрещён.
    document.addEventListener('keydown', e => {
      resumeAudio();
      const map = {
        ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 },
        ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 }
      };
      const nd = map[e.key];
      if (!nd) return;
      if (nd.x === -dir.x && nd.y === -dir.y) return;   // нельзя развернуться в себя
      nextDir = nd;
    });

    document.getElementById('restart').addEventListener('click', () => {
      resumeAudio();
      clearInterval(timer);
      initGame();
      draw();
      timer = setInterval(tick, 120);
    });

    initGame();
    draw();
    timer = setInterval(tick, 120);
  </script>
</body>
</html>
