<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Непобедимый соперник — крестики-нолики</title>
<style>
  :root{
    --bg-deep:#0d0221;
    --bg-mid:#1b0442;
    --accent:#00ffff;
    --accent-2:#ff2bd6;
    --text-light:#f4f0ff;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    min-height:100%;
    background:radial-gradient(ellipse at center, var(--bg-mid), var(--bg-deep) 70%);
    color:var(--text-light);
    font-family:"Segoe UI", system-ui, -apple-system, sans-serif;
    user-select:none;-webkit-user-select:none;
    display:flex;align-items:center;justify-content:center;
    padding:18px;
  }
  #wrap{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:18px;}

  h1{
    font-size:30px;font-weight:800;letter-spacing:1px;text-align:center;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:#fff;
  }
  .hud{display:flex;gap:26px;}
  .hud .box{text-align:center;min-width:70px;}
  .hud .label{font-size:11px;font-weight:700;letter-spacing:1.5px;opacity:.7;text-transform:uppercase;}
  .hud .val{font-size:24px;font-weight:800;}
  #wins{color:#c8ff00;} #draws{color:var(--accent);} #losses{color:var(--accent-2);}

  #board{
    display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
    width:100%;aspect-ratio:1/1;
  }
  .cell{
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.12);
    border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    font-size:clamp(38px, 16vw, 72px);font-weight:800;line-height:1;
    cursor:pointer;transition:background .15s ease, transform .08s ease;
  }
  .cell:active{transform:scale(.96);}
  .cell.taken{cursor:default;}
  .cell.x{color:var(--accent);text-shadow:0 0 18px rgba(0,255,255,.7);}
  .cell.o{color:var(--accent-2);text-shadow:0 0 18px rgba(255,43,214,.7);}
  .cell.win{background:rgba(200,255,0,.16);border-color:#c8ff00;}

  #status{font-size:18px;font-weight:700;min-height:26px;text-align:center;}
  button{
    padding:13px 32px;border:none;border-radius:999px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    font-family:inherit;font-weight:800;font-size:18px;cursor:pointer;color:#0d0221;
    box-shadow:0 6px 26px rgba(0,255,255,.35);transition:transform .1s ease;
  }
  button:active{transform:scale(.95);}
  .hint{font-size:13px;opacity:.6;text-align:center;line-height:1.5;}
</style>
</head>
<body>
<div id="wrap">
  <h1>Непобедимый соперник</h1>

  <div class="hud">
    <div class="box"><div class="label">Победы</div><div class="val" id="wins">0</div></div>
    <div class="box"><div class="label">Ничьи</div><div class="val" id="draws">0</div></div>
    <div class="box"><div class="label">Поражения</div><div class="val" id="losses">0</div></div>
  </div>

  <div id="board"></div>

  <div id="status">Твой ход. Ты — крестики.</div>
  <button id="again">Играть снова</button>
  <div class="hint">Нажимай на клетку пальцем или мышкой.<br>Обыграть его нельзя — можно только свести вничью.</div>
</div>

<script>
"use strict";

/* ══════════════════════════════════════════════════════════════════════
   Крестики-нолики против компьютера, который не проигрывает.

   Ход соперника считает минимакс — полный перебор всех продолжений.
   Из него сами собой получаются те самые три правила:
     • есть свой победный ход — ставит третий нолик и выигрывает;
     • у игрока две в ряд — занимает третью клетку и блокирует;
     • в начале партии забирает центр, потому что это сильнейшая клетка.
   ══════════════════════════════════════════════════════════════════════ */

const HUMAN = 'X';
const BOT   = 'O';
const LINES = [
  [0,1,2],[3,4,5],[6,7,8],   // ряды
  [0,3,6],[1,4,7],[2,5,8],   // столбцы
  [0,4,8],[2,4,6]            // диагонали
];

let board = Array(9).fill('');
let over = false;
let games = 0, wins = 0, draws = 0, losses = 0;

const boardEl = document.getElementById('board');
const statusEl = document.getElementById('status');
const cells = [];

for (let i = 0; i < 9; i++){
  const c = document.createElement('div');
  c.className = 'cell';
  c.addEventListener('click', () => humanMove(i));
  boardEl.appendChild(c);
  cells.push(c);
}

/* ── Правила ────────────────────────────────────────────────────────── */
function winnerOf(b){
  for (const [a, x, y] of LINES){
    if (b[a] && b[a] === b[x] && b[a] === b[y]) return { mark: b[a], line: [a, x, y] };
  }
  return b.every(v => v) ? { mark: 'draw', line: [] } : null;
}

/* ── Минимакс: бот считает партию до конца ──────────────────────────── */
function minimax(b, isBot){
  const res = winnerOf(b);
  if (res){
    if (res.mark === BOT)   return { score:  1 };
    if (res.mark === HUMAN) return { score: -1 };
    return { score: 0 };
  }

  let bestScore = isBot ? -Infinity : Infinity;
  let bestMove = -1;

  for (let i = 0; i < 9; i++){
    if (b[i]) continue;
    b[i] = isBot ? BOT : HUMAN;
    const { score } = minimax(b, !isBot);
    b[i] = '';
    if (isBot ? score > bestScore : score < bestScore){
      bestScore = score;
      bestMove = i;
    }
  }
  return { score: bestScore, move: bestMove };
}

/* ── Ходы ───────────────────────────────────────────────────────────── */
function humanMove(i){
  if (over || board[i]) return;
  place(i, HUMAN);
  if (finishIfOver()) return;

  statusEl.textContent = 'Соперник думает…';
  setTimeout(botMove, 260);          // пауза, чтобы ход было видно
}

function botMove(){
  if (over) return;
  // Центр в первый ход — минимакс выбирает его сам, но проверка дешевле перебора.
  const i = (board.every(v => !v)) ? 4 : minimax(board.slice(), true).move;
  place(i, BOT);
  if (finishIfOver()) return;
  statusEl.textContent = 'Твой ход.';
}

function place(i, mark){
  board[i] = mark;
  cells[i].textContent = mark === HUMAN ? '✕' : '◯';
  cells[i].classList.add('taken', mark === HUMAN ? 'x' : 'o');
}

/* ── Конец партии ───────────────────────────────────────────────────── */
function finishIfOver(){
  const res = winnerOf(board);
  if (!res) return false;

  over = true;
  games += 1;
  res.line.forEach(i => cells[i].classList.add('win'));

  let outcome;
  if (res.mark === HUMAN){ wins += 1;   outcome = 'победа';   statusEl.textContent = 'Ты выиграл! Такого не должно было случиться.'; }
  else if (res.mark === BOT){ losses += 1; outcome = 'поражение'; statusEl.textContent = 'Поражение. Соперник не ошибается.'; }
  else { draws += 1; outcome = 'ничья'; statusEl.textContent = 'Ничья — это лучший результат, который тут возможен.'; }

  document.getElementById('wins').textContent   = wins;
  document.getElementById('draws').textContent  = draws;
  document.getElementById('losses').textContent = losses;

  // Журнал запуска: по нему видно, сколько партий студент сыграл и чем они кончились.
  console.log('Крестики-нолики: партия ' + games + ' окончена — ' + outcome
    + '. Счёт серии: побед ' + wins + ', ничьих ' + draws + ', поражений ' + losses);
  return true;
}

/* ── Новая партия ───────────────────────────────────────────────────── */
function reset(){
  board = Array(9).fill('');
  over = false;
  cells.forEach(c => { c.textContent = ''; c.className = 'cell'; });
  statusEl.textContent = 'Твой ход. Ты — крестики.';
}
document.getElementById('again').addEventListener('click', reset);

console.log('Крестики-нолики: игра запущена');
</script>
</body>
</html>
