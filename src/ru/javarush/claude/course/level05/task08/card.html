<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Визитка Максима — создателя цифровых продуктов.">
  <title>Максим — digital creator</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f4efe7;
      --muted: #9ba7b6;
      --surface: #131a23;
      --surface-raised: #1b2430;
      --line: rgba(244, 239, 231, 0.15);
      --accent: #eeb36a;
      --accent-ink: #1b1510;
      --warm: #d99a83;
      --cool: #8ca7c4;
      --shadow: rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: #090d13;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 14% 10%, rgba(140, 167, 196, 0.12), transparent 25rem),
        linear-gradient(135deg, #0b1017 0%, #121a24 55%, #090d13 100%);
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      content: "";
      opacity: 0.22;
      background-image: linear-gradient(rgba(243, 241, 232, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(243, 241, 232, 0.045) 1px, transparent 1px);
      background-size: 3rem 3rem;
      mask-image: linear-gradient(to bottom, black, transparent 82%);
    }

    .page {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: clamp(1.25rem, 4vw, 4rem);
    }

    .card {
      position: relative;
      width: min(100%, 66rem);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 1.25rem;
      background: linear-gradient(145deg, var(--surface-raised) 0%, var(--surface) 58%, #10161e 100%);
      box-shadow: 1.25rem 1.25rem 0 rgba(238, 179, 106, 0.1), 0 2rem 5rem var(--shadow);
      animation: card-in 700ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .card::before {
      position: absolute;
      top: 0;
      left: 0;
      width: 7rem;
      height: 0.2rem;
      background: linear-gradient(90deg, var(--accent), transparent);
      content: "";
    }

    .card::after {
      position: absolute;
      top: -7rem;
      right: -5rem;
      width: 18rem;
      height: 18rem;
      border: 1px solid rgba(238, 179, 106, 0.3);
      border-radius: 50%;
      content: "";
      box-shadow: 0 0 0 2.5rem rgba(140, 167, 196, 0.045), 0 0 0 5rem rgba(140, 167, 196, 0.025);
    }

    .card__topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.2rem clamp(1.25rem, 5vw, 4rem);
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      color: var(--accent);
    }

    .status::before {
      width: 0.45rem;
      height: 0.45rem;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0.9rem var(--accent);
      content: "";
    }

    .card__body {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(15rem, 0.7fr);
      gap: clamp(2.5rem, 7vw, 6rem);
      padding: clamp(2.5rem, 7vw, 5.5rem) clamp(1.25rem, 5vw, 4rem) clamp(2rem, 6vw, 4.5rem);
    }

    .eyebrow {
      margin: 0 0 1.5rem;
      color: var(--warm);
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    h1 {
      max-width: 8ch;
      margin: 0;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(4rem, 11vw, 8.5rem);
      font-weight: 400;
      letter-spacing: -0.07em;
      line-height: 0.86;
    }

    .intro {
      max-width: 33rem;
      margin: clamp(2rem, 5vw, 4rem) 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 1.7vw, 1.2rem);
      line-height: 1.6;
    }

    .intro strong {
      color: var(--ink);
      font-weight: 500;
    }

    .contact {
      align-self: end;
      padding-top: 1.5rem;
    }

    .contact__title {
      margin: 0 0 1.2rem;
      color: var(--muted);
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .contact__list {
      display: grid;
      gap: 0.65rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .contact a {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      min-height: 3rem;
      padding: 0.75rem 0.85rem;
      border: 1px solid var(--line);
      border-radius: 0.55rem;
      color: var(--ink);
      font-size: 0.95rem;
      text-decoration: none;
      transition: border-color 180ms ease, background 180ms ease, color 180ms ease, transform 180ms ease;
    }

    .contact a::after {
      color: var(--accent);
      content: "↗";
      font-size: 1.1rem;
      transition: transform 180ms ease;
    }

    .contact a:hover {
      border-color: var(--accent);
      background: rgba(238, 179, 106, 0.08);
      color: var(--accent);
      transform: translateX(0.2rem);
    }

    .contact a:hover::after {
      transform: translate(0.15rem, -0.15rem);
    }

    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 0.35rem;
    }

    .card__footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.2rem clamp(1.25rem, 5vw, 4rem);
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.78rem;
    }

    .footer-mark {
      color: var(--accent);
      font-size: 1.2rem;
    }

    @keyframes card-in {
      from {
        opacity: 0;
        transform: translateY(1.25rem);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 700px) {
      .page {
        place-items: start center;
        padding: 1rem;
      }

      .card {
        margin-block: 1rem;
        border-radius: 0.9rem;
        box-shadow: 0.65rem 0.65rem 0 rgba(238, 179, 106, 0.1), 0 1rem 3rem var(--shadow);
      }

      .card__topline {
        align-items: flex-start;
        flex-direction: column;
        gap: 0.45rem;
      }

      .card__body {
        grid-template-columns: 1fr;
        gap: 2.5rem;
        padding-top: 3.5rem;
      }

      h1 {
        font-size: clamp(4rem, 22vw, 6.5rem);
      }

      .contact {
        padding-top: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <article class="card" aria-labelledby="card-title">
      <div class="card__topline">
        <span>Personal card / 2026</span>
        <span class="status">Открыт к идеям</span>
      </div>

      <div class="card__body">
        <header>
          <p class="eyebrow">Привет, я</p>
          <h1 id="card-title">Максим</h1>
          <p class="intro">
            Собираю <strong>понятные цифровые продукты</strong> — от первой идеи
            до страницы, которой хочется пользоваться.
          </p>
        </header>

        <section class="contact" aria-labelledby="contact-title">
          <h2 class="contact__title" id="contact-title">Связаться</h2>
          <ul class="contact__list">
            <li>
              <a href="mailto:maxim@example.com">maxim@example.com</a>
            </li>
            <li>
              <a href="https://github.com/maxim" target="_blank" rel="noreferrer">GitHub</a>
            </li>
          </ul>
        </section>
      </div>

      <footer class="card__footer">
        <span>Создаю с вниманием к деталям</span>
        <span class="footer-mark" aria-hidden="true">✳</span>
      </footer>
    </article>
  </main>
</body>
</html>
