<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>2048</title>
<style>
  :root{
    --bg-page:#1a1a2e;
    --bg-board:#bbada0;
    --cell-empty:#cdc1b4;
    --text-light:#f9f6f2;
    --gap:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--bg-page);
    font-family:"Helvetica Neue",Arial,sans-serif;
    color:var(--text-light);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100vh;padding:16px;gap:16px;
    user-select:none;touch-action:none;
  }
  .wrap{width:min(92vw,460px);}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}
  .title{font-size:52px;font-weight:800;letter-spacing:-1px;color:var(--text-light);
    text-shadow:0 2px 10px rgba(0,0,0,.35);}
  .scores{display:flex;gap:10px;}
  .score-box{background:var(--bg-board);border-radius:8px;padding:8px 16px;min-width:78px;
    text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.25);}
  .score-box .label{font-size:11px;font-weight:700;letter-spacing:1px;opacity:.75;text-transform:uppercase;}
  .score-box .val{font-size:22px;font-weight:800;line-height:1.1;}
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
  .hint{font-size:13px;opacity:.7;}
  .btns{display:flex;gap:8px;}
  button{font-family:inherit;font-weight:700;cursor:pointer;border:none;border-radius:8px;
    background:#8f7a66;color:var(--text-light);padding:10px 16px;font-size:14px;
    transition:background .15s, transform .05s;box-shadow:0 2px 6px rgba(0,0,0,.25);}
  button:hover{background:#9c8574;}
  button:active{transform:scale(.96);}
  .icon-btn{padding:10px 12px;font-size:16px;}

  /* Board */
  .board{position:relative;background:var(--bg-board);border-radius:10px;padding:var(--gap);
    width:100%;aspect-ratio:1/1;box-shadow:0 8px 30px rgba(0,0,0,.4);touch-action:none;}
  .grid{position:absolute;inset:var(--gap);display:grid;
    grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:var(--gap);}
  .cell{background:var(--cell-empty);border-radius:6px;}

  /* Tiles live in the same layer, absolutely positioned by JS */
  .tiles{position:absolute;inset:var(--gap);}
  .tile{position:absolute;display:flex;align-items:center;justify-content:center;
    border-radius:6px;font-weight:800;
    transition:transform .12s ease-in-out;
    will-change:transform;}
  .tile .face{transform:scale(1);transition:transform .12s ease-in-out;
    display:flex;align-items:center;justify-content:center;width:100%;height:100%;}
  .tile.new .face{animation:pop .15s ease-in-out;}
  .tile.merged .face{animation:pulse .13s ease-in-out;}
  @keyframes pop{from{transform:scale(0);}to{transform:scale(1);}}
  @keyframes pulse{0%{transform:scale(1);}50%{transform:scale(1.15);}100%{transform:scale(1);}}

  /* Overlay */
  .overlay{position:absolute;inset:0;border-radius:10px;
    background:rgba(238,228,218,.78);color:#776e65;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:5;text-align:center;padding:20px;}
  .overlay.show{opacity:1;pointer-events:auto;}
  .overlay h2{font-size:40px;font-weight:800;}
  .overlay p{font-size:16px;opacity:.85;}
  .overlay.win{background:rgba(237,194,46,.85);color:var(--text-light);}
  @media (max-width:420px){
    .title{font-size:40px;}
    .score-box{min-width:64px;padding:6px 10px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">2048</div>
    <div class="scores">
      <div class="score-box"><div class="label">Score</div><div class="val" id="score">0</div></div>
      <div class="score-box"><div class="label">Best</div><div class="val" id="best">0</div></div>
    </div>
  </header>

  <div class="toolbar">
    <div class="hint">Собирай плитки. Дойди до 2048! Стрелки, WASD или свайпы.</div>
    <div class="btns">
      <button class="icon-btn" id="mute" title="Звук">🔊</button>
      <button id="new">Новая игра</button>
    </div>
  </div>

  <div class="board" id="board">
    <div class="grid" id="grid"></div>
    <div class="tiles" id="tiles"></div>
    <div class="overlay" id="overlay">
      <h2 id="ov-title"></h2>
      <p id="ov-sub"></p>
      <div class="btns" id="ov-btns"></div>
    </div>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   2048 — ванильная реализация по ТЗ-эталону.
   Логика оперирует ТОЛЬКО числами; отображение отделено (§8 ТЗ).
   ============================================================ */

const SIZE = 4;

/* ---- Отображение плиток: значение → внешний вид (§8) ----
   Смена этой таблицы = смена темы (цифры → эмодзи-эволюция и т.п.),
   логика не меняется. По умолчанию — само число. */
function getTileFace(value){
  return String(value); // тема: цифры. Для эволюции вернуть эмодзи по value.
}

/* Цвета плиток по значению (§3 ТЗ) */
const TILE_COLORS = {
  2:['#eee4da','#776e65'], 4:['#ede0c8','#776e65'],
  8:['#f2b179','#f9f6f2'], 16:['#f59563','#f9f6f2'],
  32:['#f67c5f','#f9f6f2'], 64:['#f65e3b','#f9f6f2'],
  128:['#edcf72','#f9f6f2'], 256:['#edcc61','#f9f6f2'],
  512:['#edc850','#f9f6f2'], 1024:['#edc53f','#f9f6f2'],
  2048:['#edc22e','#f9f6f2']
};
function tileColor(value){ return TILE_COLORS[value] || ['#3c3a32','#f9f6f2']; }
function tileFontSize(value){
  const len = getTileFace(value).length;
  if (value >= 1024 || len >= 4) return 0.34;   // доля от размера ячейки
  if (value >= 128 || len === 3) return 0.42;
  return 0.5;
}

/* ---- Состояние ---- */
let grid;                 // 4×4 массив чисел (0 = пусто)
let tiles = new Map();    // id -> {value,row,col,el,merged,isNew}
let nextId = 1;
let score = 0;
let best = Number(localStorage.getItem('best2048') || 0);
let animating = false;
let won = false;          // показывали ли уже победу
let over = false;

const $ = id => document.getElementById(id);
const boardEl = $('board'), tilesEl = $('tiles');

/* ---- Инициализация статичной сетки ---- */
function buildGrid(){
  const g = $('grid');
  for (let i=0;i<SIZE*SIZE;i++){ const c=document.createElement('div'); c.className='cell'; g.appendChild(c); }
}

/* Геометрия: позиция и размер плитки в пикселях по (row,col) */
function cellMetrics(){
  const inner = tilesEl.clientWidth;                 // ширина области плиток
  const gap = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--gap'));
  const cell = (inner - gap*(SIZE-1)) / SIZE;
  return {gap, cell};
}
function place(el, row, col){
  const {gap, cell} = cellMetrics();
  el.style.width = cell+'px';
  el.style.height = cell+'px';
  el.style.transform = `translate(${col*(cell+gap)}px, ${row*(cell+gap)}px)`;
  el.style.fontSize = (cell*tileFontSize(currentValueOf(el)))+'px';
}
function currentValueOf(el){ return Number(el.dataset.value); }

/* ---- Рендер плиток из tiles Map ---- */
function styleTile(t){
  const [bg,color] = tileColor(t.value);
  t.el.style.background = bg;
  t.el.style.color = color;
  t.el.dataset.value = t.value;
  t.el.querySelector('.face').textContent = getTileFace(t.value);
  place(t.el, t.row, t.col);
}
function createTileEl(t){
  const el = document.createElement('div');
  el.className = 'tile' + (t.isNew ? ' new':'');
  const face = document.createElement('div'); face.className='face';
  el.appendChild(face);
  tilesEl.appendChild(el);
  t.el = el;
  styleTile(t);
  if (t.isNew){ el.addEventListener('animationend',()=>el.classList.remove('new'),{once:true}); }
}

/* ---- Игровые примитивы ---- */
function emptyCells(){
  const res=[];
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++) if(grid[r][c]===0) res.push([r,c]);
  return res;
}
function addRandomTile(){
  const empty = emptyCells();
  if(!empty.length) return null;
  const [r,c] = empty[Math.floor(Math.random()*empty.length)];
  const value = Math.random() < 0.9 ? 2 : 4;   // 90/10 (§1)
  grid[r][c] = value;
  const t = {id:nextId++, value, row:r, col:c, isNew:true};
  tiles.set(t.id, t);
  createTileEl(t);
  return t;
}
function tileAt(r,c){
  for(const t of tiles.values()) if(t.row===r && t.col===c) return t;
  return null;
}

/* Ход влево как базовая операция; остальные направления — через поворот (§7.4) */
function rotateGridCW(times){
  for(let n=0;n<times;n++){
    const ng = Array.from({length:SIZE},()=>Array(SIZE).fill(0));
    for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++) ng[c][SIZE-1-r]=grid[r][c];
    grid = ng;
    for(const t of tiles.values()){ const nr=t.col, nc=SIZE-1-t.row; t.row=nr; t.col=nc; }
  }
}

/* Выполнить ход. dir: 0=left,1=up,2=right,3=down. Возвращает {moved, gained} */
function move(dir){
  // Приводим к «ходу влево» поворотами
  const rot = dir;                 // сколько поворотов CW, чтобы нужная сторона стала левой
  rotateGridCW((4-rot)%4);
  const res = moveLeft();
  rotateGridCW(rot%4);
  return res;
}

function moveLeft(){
  let moved=false, gained=0;
  for(let r=0;r<SIZE;r++){
    // Собираем плитки этой строки по порядку слева направо
    const rowTiles=[];
    for(let c=0;c<SIZE;c++){ const t=tileAt(r,c); if(t) rowTiles.push(t); }
    let target=0;                  // куда кладём следующую плитку
    let lastMerged=null;
    const newRow=Array(SIZE).fill(0);
    for(let i=0;i<rowTiles.length;i++){
      const t=rowTiles[i];
      if(lastMerged && lastMerged.value===t.value){
        // слияние в предыдущую положенную плитку
        lastMerged.value*=2;
        gained+=lastMerged.value;
        // t уезжает в ячейку lastMerged и исчезает
        t.row=r; t.col=lastMerged.col; t.mergedInto=lastMerged;
        lastMerged.mergedFlag=true;
        newRow[lastMerged.col]=lastMerged.value;
        lastMerged=null;           // одно слияние на плитку за ход (§1.3)
        moved=true;
      } else {
        if(t.col!==target) moved=true;
        t.row=r; t.col=target;
        newRow[target]=t.value;
        lastMerged=t;
        target++;
      }
    }
    for(let c=0;c<SIZE;c++) grid[r][c]=newRow[c];
  }
  return {moved, gained};
}

/* После вычисления move() применяем к DOM: двигаем, потом удаляем слитые, ставим value */
function applyMoveToDOM(){
  // переместить все существующие плитки (и выжившие, и уезжающие в слияние) к их новым координатам
  for(const t of tiles.values()){ place(t.el,t.row,t.col); }
  // после анимации движения — убрать слитые и обновить значения/пульс
  setTimeout(()=>{
    for(const [id,t] of Array.from(tiles.entries())){
      if(t.mergedInto){ t.el.remove(); tiles.delete(id); }
    }
    for(const t of tiles.values()){
      if(t.mergedFlag){
        styleTile(t);
        t.el.classList.add('merged');
        t.el.addEventListener('animationend',()=>t.el.classList.remove('merged'),{once:true});
        t.mergedFlag=false;
      }
    }
  },120);
}

/* ---- Проверки конца игры ---- */
function hasMoves(){
  if(emptyCells().length) return true;
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
    const v=grid[r][c];
    if(c+1<SIZE && grid[r][c+1]===v) return true;
    if(r+1<SIZE && grid[r+1][c]===v) return true;
  }
  return false;
}
function maxValue(){ let m=0; for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++) if(grid[r][c]>m)m=grid[r][c]; return m; }

/* ---- Управление ходом ---- */
const DIRS = {ArrowLeft:0,a:0,A:0, ArrowUp:1,w:1,W:1, ArrowRight:2,d:2,D:2, ArrowDown:3,s:3,S:3};

function doMove(dir){
  if(animating || over) return;
  const {moved, gained} = move(dir);
  if(!moved){ return; }             // ход ничего не изменил — новой плитки нет (§1)
  animating=true;
  score += gained;
  if(gained>0) sound('merge'); else sound('slide');
  applyMoveToDOM();
  updateScore();
  setTimeout(()=>{
    addRandomTile();
    // победа
    if(!won && maxValue()>=2048){ won=true; sound('win'); showOverlay('win'); }
    // поражение
    if(!hasMoves()){ over=true; sound('over'); showOverlay('over'); }
    animating=false;
  },130);
}

function updateScore(){
  $('score').textContent=score;
  if(score>best){ best=score; localStorage.setItem('best2048',best); }
  $('best').textContent=best;
}

/* ---- Оверлеи ---- */
function showOverlay(kind){
  const ov=$('overlay'), t=$('ov-title'), s=$('ov-sub'), b=$('ov-btns');
  ov.className='overlay show'+(kind==='win'?' win':'');
  b.innerHTML='';
  if(kind==='win'){
    t.textContent='Ты собрал 2048!'; s.textContent='Можно остановиться — или идти дальше.';
    addBtn(b,'Продолжить',()=>{ ov.className='overlay'; });
    addBtn(b,'Новая игра',startGame);
  } else {
    t.textContent='Игра окончена'; s.textContent='Счёт: '+score;
    addBtn(b,'Заново',startGame);
  }
}
function addBtn(parent,label,fn){ const btn=document.createElement('button'); btn.textContent=label; btn.onclick=fn; parent.appendChild(btn); }

/* ---- Звук (Web Audio, синтез, §5) ---- */
let actx=null, muted = localStorage.getItem('mute2048')==='1';
function ensureAudio(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function beep(freq,dur,gain,type){
  if(muted||!actx) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type||'triangle'; o.frequency.value=freq;
  g.gain.setValueAtTime(0,actx.currentTime);
  g.gain.linearRampToValueAtTime(gain,actx.currentTime+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+dur);
  o.connect(g); g.connect(actx.destination);
  o.start(); o.stop(actx.currentTime+dur+0.02);
}
function sound(kind){
  ensureAudio();
  if(kind==='slide') beep(220,0.08,0.08,'triangle');
  else if(kind==='merge') beep(440,0.10,0.14,'sine');
  else if(kind==='win'){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.14,0.16,'sine'),i*90)); }
  else if(kind==='over'){ [440,330,220].forEach((f,i)=>setTimeout(()=>beep(f,0.16,0.14,'sawtooth'),i*110)); }
}

/* ---- Ввод ---- */
window.addEventListener('keydown',e=>{
  if(e.key in DIRS){ e.preventDefault(); ensureAudio(); doMove(DIRS[e.key]); }
});
// свайпы (тач + мышь)
let sx=0,sy=0,swiping=false;
function startSwipe(x,y){ sx=x; sy=y; swiping=true; ensureAudio(); }
function endSwipe(x,y){
  if(!swiping) return; swiping=false;
  const dx=x-sx, dy=y-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<30) return;
  if(Math.abs(dx)>Math.abs(dy)) doMove(dx>0?2:0); else doMove(dy>0?3:1);
}
boardEl.addEventListener('touchstart',e=>{const t=e.touches[0];startSwipe(t.clientX,t.clientY);},{passive:true});
boardEl.addEventListener('touchend',e=>{const t=e.changedTouches[0];endSwipe(t.clientX,t.clientY);});
boardEl.addEventListener('mousedown',e=>startSwipe(e.clientX,e.clientY));
window.addEventListener('mouseup',e=>endSwipe(e.clientX,e.clientY));

/* ---- Кнопки ---- */
$('new').onclick=startGame;
$('mute').onclick=()=>{ muted=!muted; localStorage.setItem('mute2048',muted?'1':'0'); $('mute').textContent=muted?'🔇':'🔊'; };
$('mute').textContent=muted?'🔇':'🔊';

/* ---- Старт партии ---- */
function startGame(){
  grid=Array.from({length:SIZE},()=>Array(SIZE).fill(0));
  tilesEl.innerHTML='';
  tiles.clear();
  score=0; won=false; over=false; animating=false;
  $('overlay').className='overlay';
  updateScore();
  addRandomTile(); addRandomTile();
}

/* Пересчёт позиций при ресайзе (плитки позиционированы в px) */
window.addEventListener('resize',()=>{ for(const t of tiles.values()) place(t.el,t.row,t.col); });

buildGrid();
startGame();
</script>
</body>
</html>
